apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    katenary.v3/compose-hash: 02957997c43d550dc2189d830877b3934db1507a
    katenary.v3/version: release-3.0.0-rc2
  labels:
    {{- include "deploy.labels" . | nindent 4 }}
    katenary.v3/component: dashboard
  name: '{{ include "deploy.fullname" . }}-dashboard'
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "deploy.selectorLabels" . | nindent 6 }}
      katenary.v3/component: dashboard
  strategy: {}
  template:
    metadata:
      labels:
        {{- include "deploy.selectorLabels" . | nindent 8 }}
        katenary.v3/component: dashboard
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: '{{ include "deploy.fullname" . }}-dashboard'
        image: '{{ tpl .Values.dashboard.repository.image $ }}:{{ tpl .Values.dashboard.repository.tag $ | default "latest" }}'
        imagePullPolicy: {{ .Values.dashboard.imagePullPolicy }}
        name: dashboard
        ports:
        - containerPort: 8501
          name: port-8501
        {{- if .Values.dashboard.resources }}
        resources:
          {{ .Values.dashboard.resources | toYaml | nindent 10 }}
        {{- end }}
      {{- if .Values.pullSecrets }}
      imagePullSecrets:
      {{- .Values.pullSecrets | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- .Values.dashboard.nodeSelector | toYaml | nindent 8 }}
      {{- end }}
      {{- if ne .Values.dashboard.serviceAccount "" }}
      serviceAccountName: {{ .Values.dashboard.serviceAccount | quote }}
      {{- end }}
